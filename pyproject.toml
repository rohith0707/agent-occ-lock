[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-occ-lock"
version = "0.1.0"
description = "Optimistic Concurrency Control (OCC) and 3-way delta state resolution for distributed multi-agent LLM systems."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Rohith G", email = "rohith0707@users.noreply.github.com"}
]
keywords = ["multi-agent", "concurrency", "distributed-systems", "langgraph", "llm-ops", "optimistic-concurrency-control"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.20",
]

[project.urls]
Homepage = "https://github.com/rohith0707/agent-occ-lock"
Repository = "https://github.com/rohith0707/agent-occ-lock"
